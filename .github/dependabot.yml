# One grouped pull request per ecosystem, once a month, and never more than
# one open at a time, so update PRs don't pile up. Security updates are
# separate and still arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      rust-dependencies: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      frontend-dependencies: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      github-actions: { patterns: ["*"] }
