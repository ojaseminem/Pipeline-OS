name: Bug report
description: Something in Pipeline OS doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't include tokens, private paths or project files you can't share.
        Security problems go through the private process in SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: Pipeline OS version
      description: Settings → About, or `vantadeck --version`
      placeholder: "0.5.4"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "Windows 11 24H2, macOS 15.1, Ubuntu 24.04…"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a Unity project
        2. Go to Source Control
        3. …
  - type: textarea
    id: logs
    attributes:
      label: Error text or logs
      description: Paste any error message. Screenshots help too.
      render: text
