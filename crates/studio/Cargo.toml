[package]
name = "vantadeck-studio"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Studio workflow primitives: pipeline tasks, file-based issues, AI project briefs, and folder layouts."

[dependencies]
chrono.workspace = true
globset = "0.4"
ignore.workspace = true
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit = "0.22"
uuid.workspace = true
base64 = "0.22"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
